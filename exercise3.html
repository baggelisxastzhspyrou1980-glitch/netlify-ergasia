<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  Click Refresh (or Reload) to run the script again
  <script>
    var firstNumber, secondNumber, Number1, Number2, sum;
    firstNumber = window.prompt("Enter the first number", "0");
    secondNumber = window.prompt("Enter the second number", "0");
    Number1 = parseInt(firstNumber);
    Number2 = parseInt(secondNumber);
    sum = Number1 + Number2;
    document.writeln("<h1>Το άθροισμα είναι: " + sum + "</h1>");
  </script>
</body>
</html>
